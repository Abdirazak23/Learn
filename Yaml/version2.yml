# Multi-stage IaC pipeline with What-If validation
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'sc-azure-prod'
  location: 'uksouth'

stages:
# STAGE 1: Validate & Calculate Changes
- stage: ValidateAndPlan
  displayName: 'Bicep Validation & What-If'
  jobs:
  - job: BicepPlan
    displayName: 'Dry Run Analysis'
    steps:
    - task: AzureCLI@2
      displayName: 'Run Bicep What-If'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment sub what-if \
            --location $(location) \
            --template-file ./infra/main.bicep \
            --parameters ./infra/main.prod.bicepparam

# STAGE 2: Governed Deployment
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: ValidateAndPlan
  condition: succeeded()
  jobs:
  - deployment: DeployInfra
    displayName: 'Execute Bicep Deployment'
    environment: 'Production' # Requires approval gate in ADO
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Execute Azure Deployment'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment sub create \
                  --location $(location) \
                  --template-file ./infra/main.bicep \
                  --parameters ./infra/main.prod.bicepparam